# Nightly (and manual) data refresh for House Moneyball snapshots.
# Requires repo secrets: FEC_API_KEY (optional), OPENSTATES_API_KEY (optional)
name: Refresh data snapshots

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      include_outside:
        description: "FEC include 2024 IE outside spend (slow)"
        type: boolean
        default: false
      openstates:
        description: "Overlay OpenStates members"
        type: boolean
        default: true
      fec:
        description: "Pull OpenFEC House totals"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure mock masters exist
        run: |
          python scripts/generate_mock_data.py
          python scripts/generate_state_mock_data.py

      - name: OpenFEC House pull
        if: ${{ github.event_name == 'schedule' || inputs.fec }}
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          if [ -z "$FEC_API_KEY" ]; then
            echo "No FEC_API_KEY secret — skipping FEC pull"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_outside }}" = "true" ]; then
            python scripts/fetch_fec_data.py
          else
            python scripts/fetch_fec_data.py --no-outside
          fi
          python - <<'PY'
          from src.ui_common import write_refresh_meta
          from datetime import datetime, timezone
          write_refresh_meta({
              "federal_refreshed_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "federal_source": "openfec",
          })
          PY

      - name: OpenStates state overlay
        if: ${{ github.event_name == 'schedule' || inputs.openstates }}
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: |
          if [ -z "$OPENSTATES_API_KEY" ]; then
            echo "No OPENSTATES_API_KEY secret — skipping OpenStates"
            exit 0
          fi
          python scripts/build_state_masters.py --openstates
          python - <<'PY'
          from src.ui_common import write_refresh_meta
          from datetime import datetime, timezone
          write_refresh_meta({
              "state_refreshed_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "state_source": "openstates",
          }, state=True)
          PY

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master.parquet data/mock data/state data/refresh_meta.json data/state/refresh_meta.json 2>/dev/null || true
          git add data/raw/fec_district_finance.parquet data/raw/fec_outside.parquet 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: nightly data snapshot refresh"
            git push
          fi
